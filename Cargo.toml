[package]
name = "friladd"
version = "0.1.0"
edition = "2024"
description = "Install selected source files from versioned registries"
license = "MIT"
repository = "https://github.com/FrilLab/friladd"

[[bin]]
name = "friladd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2"

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.14"
